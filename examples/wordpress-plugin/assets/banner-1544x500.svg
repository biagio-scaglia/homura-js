<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1544 500" width="1544" height="500" fill="none">
  <!-- Dark Obsidian Background -->
  <rect width="1544" height="500" fill="#06030a"/>
  
  <!-- Subtle Glowing Grid -->
  <defs>
    <pattern id="gridRetina" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#a855f7" stroke-width="1" stroke-opacity="0.12" />
    </pattern>
    <radialGradient id="bannerGlowRetina" cx="20%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06030a" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="rightGlowRetina" cx="90%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#06030a" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="violetGradRetina" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3e8ff" />
      <stop offset="45%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="textGradRetina" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f3e8ff" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="shieldGlowRetina" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1544" height="500" fill="url(#gridRetina)"/>
  <rect width="1544" height="500" fill="url(#bannerGlowRetina)"/>
  <rect width="1544" height="500" fill="url(#rightGlowRetina)"/>
  <rect x="2" y="2" width="1540" height="496" rx="0" stroke="#a855f7" stroke-width="3" stroke-opacity="0.25"/>

  <!-- Left: Homura Shield (exact from favicon scaled and positioned) -->
  <g transform="translate(90, 60) scale(5.8)">
    <!-- Shield Outline -->
    <path d="M32 10 L50 20 V38 C50 48 32 56 32 56 C32 56 14 48 14 38 V20 Z" fill="#140d22" stroke="url(#violetGradRetina)" stroke-width="2.5" filter="url(#shieldGlowRetina)"/>
    
    <!-- Time Hourglass / Chronos Diamond inside Shield -->
    <polygon points="32,18 42,27 35,32 42,37 32,46 22,37 29,32 22,27" fill="url(#violetGradRetina)" />
    <circle cx="32" cy="32" r="3" fill="#ffffff" />
  </g>

  <!-- Right: Typography & Badges -->
  <g transform="translate(490, 0)">
    <!-- Badge -->
    <g transform="translate(0, 84)">
      <rect width="420" height="48" rx="24" fill="#1e1035" stroke="#a855f7" stroke-width="2" stroke-opacity="0.4" />
      <text x="24" y="32" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" letter-spacing="2">GIT FOR APPLICATION STATE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="224" fill="url(#textGradRetina)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="76" font-weight="900" letter-spacing="3">HOMURAJS</text>
    
    <!-- Subtitle -->
    <text x="0" y="292" fill="#e9d5ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="600">Time Travel &amp; Form Recovery for WordPress</text>
    
    <!-- Description / Bullets -->
    <text x="0" y="360" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="400">
      ⚡ Non-destructive DAG Undo/Redo | 🛡️ Form Crash Protection | 🛒 WooCommerce
    </text>
  </g>
</svg>
