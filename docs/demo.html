<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HomuraJS — Interactive DevTools Live Studio & Time Travel</title>
  <meta name="description" content="Experience real-time DAG state history visualizer, interactive multi-column Kanban board, and side-by-side structural diffing with HomuraJS Live Studio." />
  <meta name="keywords" content="HomuraJS Live Studio, time travel debugging demo, DAG graph visualizer, state inspector, diff viewer" />
  <meta name="author" content="Biagio Scaglia" />
  <meta name="theme-color" content="#0b0a0d" />
  <link rel="canonical" href="https://biagio-scaglia.github.io/homura-js/demo.html" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://biagio-scaglia.github.io/homura-js/demo.html" />
  <meta property="og:site_name" content="HomuraJS" />
  <meta property="og:title" content="HomuraJS — Interactive Live Studio &amp; DAG State Visualizer" />
  <meta property="og:description" content="Interactive time-travel state engine demo with visual DAG timeline, JSON inspector, and live Kanban board." />
  <meta property="og:image" content="https://biagio-scaglia.github.io/homura-js/homura-banner.png" />
  <meta property="og:image:secure_url" content="https://biagio-scaglia.github.io/homura-js/homura-banner.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1544" />
  <meta property="og:image:height" content="500" />

  <!-- Twitter Cards -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="HomuraJS — Live Studio" />
  <meta name="twitter:description" content="Interactive time-travel debugging studio for JavaScript &amp; TypeScript state graphs." />
  <meta name="twitter:image" content="https://biagio-scaglia.github.io/homura-js/homura-banner.png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-base: #0b0a0d;
      --bg-surface: #110f14;
      --bg-elevated: #17151c;
      --bg-inset: #070608;
      --bg-hover: #1f1d26;

      --text-main: #f4f0e8;
      --text-muted: #b8b2a5;
      --text-dim: #706b61;

      --vermilion: #e0382b;
      --vermilion-dim: #9e2318;
      --vermilion-subtle: rgba(224, 56, 43, 0.08);

      --border-hairline: 1px solid #1f1d24;
      --border-strong: 1px solid #33303a;
      --border-vermilion: 1px solid rgba(224, 56, 43, 0.4);

      --font-display: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-body: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', 'IBM Plex Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Icon Utility */
    .icon {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: square;
      stroke-linejoin: miter;
      fill: none;
      display: inline-block;
      vertical-align: middle;
      flex-shrink: 0;
    }
    .icon-sm { width: 12px; height: 12px; }

    /* Top Studio Header */
    header {
      border-bottom: var(--border-hairline);
      background: var(--bg-base);
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
      gap: 16px;
      font-family: var(--font-mono);
      font-size: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: inherit;
    }

    .brand-title {
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--text-main);
    }

    .badge-live {
      background: var(--bg-elevated);
      color: var(--vermilion);
      border: var(--border-hairline);
      padding: 2px 6px;
      font-size: 10px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      background: var(--vermilion);
    }

    .header-actions {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn {
      background: var(--bg-surface);
      border: var(--border-hairline);
      color: var(--text-main);
      padding: 5px 10px;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      text-decoration: none;
    }
    .btn:hover {
      background: var(--bg-hover);
      border-color: var(--border-strong);
    }
    .btn-accent {
      background: var(--vermilion);
      border-color: var(--vermilion);
      color: #fff;
    }
    .btn-accent:hover {
      background: #c52e22;
    }

    /* Main Studio Container */
    .studio-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      flex: 1;
      min-height: calc(100vh - 52px);
      background: var(--bg-base);
    }

    /* Left Panel: Kanban Machine */
    .panel-kanban {
      border-right: var(--border-hairline);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: var(--bg-base);
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      border-bottom: var(--border-hairline);
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-dim);
    }

    .kanban-board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      flex: 1;
    }

    .kanban-column {
      background: var(--bg-surface);
      border: var(--border-hairline);
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .column-header {
      padding: 8px 12px;
      border-bottom: var(--border-hairline);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-elevated);
      color: var(--text-dim);
    }

    .column-count {
      background: var(--bg-base);
      border: var(--border-hairline);
      padding: 1px 5px;
      font-size: 10px;
      color: var(--text-main);
    }

    .task-list {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
      overflow-y: auto;
      min-height: 220px;
    }

    .task-card {
      background: var(--bg-base);
      border: var(--border-hairline);
      padding: 10px;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .task-card:hover {
      border-color: var(--vermilion);
      background: var(--bg-elevated);
    }

    .task-card-title {
      font-size: 12px;
      font-weight: 500;
      line-height: 1.4;
      color: var(--text-main);
    }

    .task-card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-dim);
    }

    .tag-priority {
      padding: 1px 4px;
      border: var(--border-hairline);
    }
    .tag-priority-high { color: var(--vermilion); border-color: rgba(224, 56, 43, 0.4); }
    .tag-priority-med { color: #f59e0b; border-color: rgba(245, 158, 11, 0.4); }
    .tag-priority-low { color: #10b981; border-color: rgba(16, 185, 129, 0.4); }

    .actions-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    /* Right Panel: Event Stream & Diagnostics */
    .panel-visualizer {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: var(--bg-inset);
      overflow-y: auto;
    }

    .event-stream {
      background: var(--bg-base);
      border: var(--border-hairline);
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .stream-header {
      background: var(--bg-elevated);
      border-bottom: var(--border-hairline);
      padding: 8px 12px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-dim);
      display: flex;
      justify-content: space-between;
    }

    .event-list {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
      overflow-y: auto;
      font-family: var(--font-mono);
      font-size: 11px;
      min-height: 280px;
    }

    .log-item {
      display: flex;
      justify-content: space-between;
      padding: 4px 8px;
      background: var(--bg-surface);
      border-left: 2px solid var(--vermilion);
    }
    .log-action {
      color: var(--text-main);
      font-weight: 500;
    }
    .log-time {
      color: var(--text-dim);
      font-size: 10px;
    }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--bg-elevated);
      border: var(--border-strong);
      border-left: 3px solid var(--vermilion);
      color: var(--text-main);
      padding: 8px 14px;
      font-family: var(--font-mono);
      font-size: 11.5px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(6px);
      transition: all 0.2s ease;
      z-index: 1000;
    }
    #toast.show {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    @media (max-width: 960px) {
      .studio-container {
        grid-template-columns: 1fr;
      }
      .panel-kanban {
        border-right: none;
        border-bottom: var(--border-hairline);
      }
      .actions-bar {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- Top Studio Header -->
  <header>
    <div style="display: flex; align-items: center; gap: 12px;">
      <a href="index.html" class="brand">
        <svg class="icon icon-sm" viewBox="0 0 24 24" style="stroke: var(--vermilion);"><polyline points="15 18 9 12 15 6"></polyline></svg>
        <span class="brand-title">HOMURAJS STUDIO</span>
      </a>
      <span class="badge-live"><span class="badge-dot"></span> 焔 DAG_ENGINE</span>
    </div>

    <div class="header-actions">
      <button id="btn-undo" class="btn" title="Undo (Ctrl+Z)">↩ UNDO</button>
      <button id="btn-redo" class="btn" title="Redo (Ctrl+Y)">↪ REDO</button>
      <button id="btn-fork" class="btn" title="Fork branch">⑂ FORK</button>
      <button id="btn-merge" class="btn" title="3-Way Merge">⎇ MERGE</button>
      <button id="btn-snap" class="btn" title="Snapshot">◷ SNAPSHOT</button>
      <button id="btn-replay" class="btn" title="Replay timeline">▶ REPLAY</button>
      <button id="btn-toggle-devtools" class="btn" title="DevTools">⚡ DEVTOOLS (ALT+H)</button>
      <button id="btn-export-session" class="btn" title="Export session">💾 EXPORT</button>
      <button id="btn-import-session" class="btn" title="Import session">📂 IMPORT</button>
      <input type="file" id="file-input-session" accept=".homura,.json" style="display: none;" />
      <a href="index.html" class="btn btn-accent">← DOCS</a>
    </div>
  </header>

  <!-- Studio Workstation -->
  <div class="studio-container">
    
    <!-- Left Column: Kanban Mutator -->
    <div class="panel-kanban">
      <div class="panel-header">
        <div>STATE_MODEL // <strong>KANBAN_MUTATOR</strong></div>
        <div>BRANCH: <span id="active-branch-label" style="color: var(--vermilion); font-weight: 600;">main</span></div>
      </div>

      <div class="kanban-board">
        <!-- Column: To Do -->
        <div class="kanban-column">
          <div class="column-header">
            <span>TO DO</span>
            <span id="count-todo" class="column-count">0</span>
          </div>
          <div class="task-list" id="list-todo"></div>
        </div>

        <!-- Column: In Progress -->
        <div class="kanban-column">
          <div class="column-header">
            <span>IN PROGRESS</span>
            <span id="count-progress" class="column-count">0</span>
          </div>
          <div class="task-list" id="list-progress"></div>
        </div>

        <!-- Column: Done -->
        <div class="kanban-column">
          <div class="column-header">
            <span>DONE</span>
            <span id="count-done" class="column-count">0</span>
          </div>
          <div class="task-list" id="list-done"></div>
        </div>
      </div>

      <div class="actions-bar">
        <button id="btn-add-task" class="btn" style="justify-content: center;">+ DISPATCH TASK</button>
        <button id="btn-batch-tx" class="btn" style="justify-content: center;">⚡ ATOMIC BATCH (3x)</button>
        <button id="btn-fork" class="btn" style="justify-content: center;">⑂ FORK TIMELINE</button>
        <button id="btn-replay" class="btn" style="justify-content: center;">▶ AUTO REPLAY</button>
      </div>
    </div>

    <!-- Right Column: Event Audit Stream & Timeline Monitor -->
    <div class="panel-visualizer">
      <div class="panel-header">
        <div>RUNTIME // <strong>DAG_EVENT_STREAM</strong></div>
        <div style="font-size: 10px; color: var(--text-dim);">REAL-TIME PROXY TRAP LISTENER</div>
      </div>

      <div class="event-stream">
        <div class="stream-header">
          <span>EVENT STREAM AUDIT</span>
          <span id="event-count">0 events</span>
        </div>
        <div class="event-list" id="event-log"></div>
      </div>
    </div>

  </div>

  <!-- Toast Notification -->
  <div id="toast"></div>

  <!-- Module Script -->
  <script type="module" src="./src/demo.ts"></script>
</body>
</html>
