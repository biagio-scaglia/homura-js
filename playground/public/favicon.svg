<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background Obsidian Hexagon / Shield -->
  <rect width="64" height="64" rx="16" fill="#07050a"/>
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="#a855f7" stroke-width="2" stroke-opacity="0.4"/>
  
  <!-- Outer Glow Filter -->
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3e8ff" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
  </defs>

  <!-- Homura Time Shield & Hourglass Symbol -->
  <path d="M32 10 L50 20 V38 C50 48 32 56 32 56 C32 56 14 48 14 38 V20 Z" fill="#140d22" stroke="url(#violetGrad)" stroke-width="2.5" filter="url(#glow)"/>
  
  <!-- Time Hourglass / Chronos Diamond inside Shield -->
  <polygon points="32,18 42,27 35,32 42,37 32,46 22,37 29,32 22,27" fill="url(#violetGrad)" />
  <circle cx="32" cy="32" r="3" fill="#ffffff" />
</svg>
